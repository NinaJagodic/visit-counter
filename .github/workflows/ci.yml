name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instaliraj zavisnosti
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Linter (ruff)
        run: ruff check .

      - name: Testovi (pytest)
        run: pytest

      - name: Build Docker image
        run: docker build -t visit-counter:latest .

      - name: Trivy skeniranje
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'visit-counter:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Pokretanje Docker Compose-a
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Healthcheck skripta
        run: |
          chmod +x ./scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:5000

      - name: Docker logovi za debagovanje
        if: failure()
        run: docker compose logs
        
      - name: Prijavi se na GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Izgradi i objavi sliku (Push to GHCR sa SHA tagom)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/visit-counter:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/visit-counter:latest